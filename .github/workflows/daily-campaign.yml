name: Disparo diário de prospecção

on:
  schedule:
    # 10h horário de Brasília (UTC-3) = 13h UTC, todo dia
    - cron: "0 13 * * *"

  # Permite rodar manualmente pelo GitHub (Actions > Run workflow)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (simula sem enviar)"
        type: boolean
        default: false
      limit:
        description: "Máximo de emails hoje (deixe vazio = 300)"
        type: number

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install requests supabase

      - name: Disparar campanha
        working-directory: scripts/prospecting
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BREVO_API_KEY:        ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL:         ${{ secrets.SENDER_EMAIL }}
          SENDER_NAME:          ${{ secrets.SENDER_NAME }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.limit }}" ];         then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python 02_send_campaign.py $ARGS
